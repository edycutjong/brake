name: CI/CD Pipeline

# PR → Stage 1 (Quality: contracts + node) ─┐
#                                           ├─ parallel ─→ Stage 3 (Build) ─┬─→ Stage 4 (E2E)
# PR → Stage 2 (Security: gitleaks + SCA) ──┘                               └─→ Stage 5 (Performance)
#                                                         Stage 6 (Deploy gate, main only) ← all of the above
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── STAGE 1 · Quality (parallel with Stage 2) ─────────────────────────────────────
  contracts:
    name: "Stage 1 · Contracts (fmt, build, fork tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format check (forge fmt)
        run: forge fmt --check
      - name: Build with contract sizes
        run: forge build --sizes
      # tests pin their own fork of Aevum testnet 44005 (foundry.toml rpc alias, public RPC, no secrets)
      - name: Fork tests against live tUSD8 bytecode
        run: forge test -vv

  node-quality:
    name: "Stage 1 · TypeScript (typecheck, unit + property tests) · node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # full matrix on main pushes, a single node on PRs
        node-version: ${{ github.event_name == 'push' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all workspaces)
        run: pnpm -r --if-present typecheck
      - name: Unit + property tests (brake-signer, engine; 3 × 10,000 fast-check cases)
        run: pnpm -r --if-present test

  # ── STAGE 2 · Security (parallel with Stage 1) ────────────────────────────────────
  secret-scan:
    name: "Stage 2 · Secret scan (gitleaks, full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over every commit
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact

  dependency-audit:
    name: "Stage 2 · Dependency audit + licences"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        run: pnpm audit --prod
      - name: Licence check (no GPL-3.0 / AGPL-3.0 in production deps)
        run: |
          pnpm licenses list --prod --json > licenses.json
          node -e '
            const l = require("./licenses.json"); const bad = Object.keys(l).filter(k => /^(A?GPL-3\.0)/.test(k));
            console.log("licences:", Object.keys(l).join(", "));
            if (bad.length) { console.error("::error::copyleft licence in production deps: " + bad.join(", ")); process.exit(1); }'

  # ── STAGE 3 · Build verification ──────────────────────────────────────────────────
  build:
    name: "Stage 3 · Build (Next.js app, brake-signer package, bundle budget)"
    needs: [contracts, node-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next.js production build
        run: pnpm --filter @brake/web build
      - name: Bundle budget (warn 1500 KB, fail 2000 KB)
        run: |
          KB=$(du -sk apps/web/.next/static | cut -f1)
          echo "static assets: ${KB} KB"
          if [ "$KB" -gt 2000 ]; then echo "::error::bundle ${KB} KB > 2000 KB"; exit 1
          elif [ "$KB" -gt 1500 ]; then echo "::warning::bundle ${KB} KB > 1500 KB"
          else echo "within budget"; fi
      - name: brake-signer builds and packs (what npm would publish)
        run: |
          pnpm --filter brake-signer build
          cd packages/brake-signer && npm pack --dry-run 2>&1 | tail -15
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          include-hidden-files: true
          retention-days: 3

  # ── STAGE 4 · E2E ─────────────────────────────────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E (Playwright: /judge with no credentials, smoke, responsive)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: apps/web/.next
      - name: Install Chromium
        run: pnpm --filter @brake/web exec playwright install --with-deps chromium
      - name: Playwright (desktop + Pixel 7)
        run: pnpm --filter @brake/web e2e
        env:
          NODE_ENV: production
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # ── STAGE 5 · Performance ─────────────────────────────────────────────────────────
  performance:
    name: "Stage 5 · Performance (Lighthouse CI: app + landing/deck)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: apps/web/.next
      # accessibility < 0.9 is a hard error; performance / best practices / SEO are warnings
      - name: Lighthouse — app (/, /judge)
        run: pnpm --filter @brake/web exec lhci autorun
      - name: Lighthouse — landing page + pitch deck (docs/, served at brake.edycu.dev)
        run: apps/web/node_modules/.bin/lhci autorun --config=lighthouserc.landing.json # repo root, so staticDistDir ./docs resolves

  # ── STAGE 6 · Deploy gate (main only) ─────────────────────────────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy gate"
    needs: [build, e2e, performance, secret-scan, dependency-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: |
          {
            echo "## All CI/CD gates passed"
            echo "| Stage | Gate |"
            echo "|---|---|"
            echo "| 1 · Quality | forge fmt + build + 50 fork tests · typecheck + unit/property tests (node 22, 24) |"
            echo "| 2 · Security | gitleaks full history · pnpm audit · licence check |"
            echo "| 3 · Build | Next.js build · bundle budget · brake-signer pack |"
            echo "| 4 · E2E | Playwright: /judge no-auth, smoke, responsive (desktop + mobile) |"
            echo "| 5 · Performance | Lighthouse CI: app + landing/deck (a11y ≥ 0.9 hard gate) |"
            echo "| 6 · Deploy gate | main only |"
          } >> "$GITHUB_STEP_SUMMARY"

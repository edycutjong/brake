[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Aevum testnet (cdk-erigon) accepts PUSH0 but rejects MCOPY/TSTORE (probed 2026-11-16) -> shanghai
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./evidence" }]

# fork tests run against the live Aevum testnet state (archive RPC, chain id 44005)
[profile.fork]
eth_rpc_url = "aevum"

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[etherscan]
aevum = { key = "blockscout", url = "https://explorer-test.qday.info/api", chain = 44005 }

[fmt]
line_length = 120

[lint]
lint_on_build = false
